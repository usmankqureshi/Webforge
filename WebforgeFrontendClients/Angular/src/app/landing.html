<main class="container py-5">
  <a routerLink="/" class="brand d-inline-block text-decoration-none mb-5" aria-label="Webforge home">WEBFORGE</a>
  <section class="card shadow-sm p-4 p-md-5">
    <p class="text-uppercase text-secondary small fw-semibold">Content management platform</p>
    <h1 class="display-5 fw-bold">A home for your next story.</h1>
    <p class="lead text-secondary mt-3">Create, edit, and manage your posts in your content workspace.</p>
    <nav class="mt-3" aria-label="Workspace">
      <a routerLink="/posts" class="btn btn-success">Posts</a>
    </nav>
    <div class="alert mt-4" [class.alert-success]="connected()" [class.alert-warning]="!connected()" role="status">
      {{ status() }}
    </div>
    <nav class="d-flex gap-4 mt-3" aria-label="Development resources">
      <a href="/openapi/v1.json">API specification</a>
      <a href="/health/ready">Database readiness</a>
    </nav>
  </section>
</main>
